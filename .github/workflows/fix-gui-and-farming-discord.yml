name: Fix TastyFish GUI and farming Discord integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[auto-fix-gui]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply GUI/HUD fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/main/java/com/epic60869/tastyfish/TastyFishMod.java')
          s = p.read_text()
          s = s.replace('                .then(ClientCommands.literal("discord").executes(context -> { printDiscordHelp(); return 1; }))\n                .then(ClientCommands.literal("guildhud").executes(context -> { toggleGuildHud(); return 1; })));',
                        '                .then(ClientCommands.literal("discord").executes(context -> { printDiscordHelp(); return 1; })));')
          s = re.sub(r'\n    private void toggleGuildHud\(\) \{.*?\n    \}\n', '\n', s, count=1, flags=re.S)
          p.write_text(s)

          p = Path('src/main/java/com/epic60869/tastyfish/TastyFishConfig.java')
          s = p.read_text()
          s = s.replace('public String guildLeaderboardWebsite = "https://farming.tastyfish.org";', 'public String guildLeaderboardWebsite = "https://tastyfish.org";')
          s = s.replace('if (c.guildLeaderboardWebsite == null || c.guildLeaderboardWebsite.isBlank()) c.guildLeaderboardWebsite = c.farmingServerEndpoint;', 'c.guildLeaderboardWebsite = "https://tastyfish.org";')
          p.write_text(s)

          p = Path('src/main/java/com/epic60869/tastyfish/TastyFishWebsiteClient.java')
          s = p.read_text()
          s = s.replace('String base = value == null || value.isBlank() ? "https://tastyfish.org" : value.trim();', 'String base = "https://tastyfish.org";')
          s = s.replace('URI.create(base + "/api/leaderboards/" + encode(boardId))', 'URI.create(base + "/api/leaderboards/collection/" + encode(boardId))')
          old = '''        JsonArray boards = root.has("leaderboards") && root.get("leaderboards").isJsonArray()\n            ? root.getAsJsonArray("leaderboards") : new JsonArray();\n        String wanted = normalize(crop);\n        String compactWanted = wanted.replace(" ", "");\n\n        String fallback = null;\n        for (JsonElement element : boards) {\n            if (!element.isJsonObject()) continue;\n            JsonObject board = element.getAsJsonObject();\n            String id = string(board, "id", "");\n            String name = string(board, "name", "");\n            String apiValue = string(board, "apiValue", "");\n            String label = string(board, "valueLabel", "");\n            String haystack = normalize(id + " " + name + " " + apiValue + " " + label);\n            String compact = haystack.replace(" ", "");\n            if (haystack.contains(wanted) || compact.contains(compactWanted)) {\n                return id;\n            }\n            if (aliases(crop).stream().anyMatch(alias -> haystack.contains(alias) || compact.contains(alias.replace(" ", "")))) {\n                fallback = id;\n            }\n        }\n        return fallback;'''
          new = '''        String wanted = normalize(crop);\n        String compactWanted = wanted.replace(" ", "");\n        List<JsonObject> boards = new ArrayList<>();\n        if (root.has("leaderboards") && root.get("leaderboards").isJsonArray()) {\n            for (JsonElement element : root.getAsJsonArray("leaderboards")) {\n                if (element.isJsonObject()) boards.add(element.getAsJsonObject());\n            }\n        }\n        if (root.has("categories") && root.get("categories").isJsonObject()) {\n            for (JsonElement category : root.getAsJsonObject("categories").entrySet().stream().map(java.util.Map.Entry::getValue).toList()) {\n                if (!category.isJsonArray()) continue;\n                for (JsonElement element : category.getAsJsonArray()) {\n                    if (element.isJsonObject()) boards.add(element.getAsJsonObject());\n                }\n            }\n        }\n\n        String fallback = null;\n        for (JsonObject board : boards) {\n            String id = string(board, "id", "");\n            String name = string(board, "name", "");\n            String apiValue = string(board, "apiValue", "");\n            String label = string(board, "valueLabel", "");\n            String haystack = normalize(id + " " + name + " " + apiValue + " " + label);\n            String compact = haystack.replace(" ", "");\n            if (haystack.contains(wanted) || compact.contains(compactWanted)) return id;\n            if (aliases(crop).stream().anyMatch(alias -> haystack.contains(alias) || compact.contains(alias.replace(" ", "")))) fallback = id;\n        }\n        return fallback;'''
          if old not in s:
              raise SystemExit('findBoardId block not found')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('src/main/java/com/epic60869/tastyfish/TastyFishScreen.java')
          s = p.read_text()
          s = s.replace('    private EditBox discordEndpointBox;\n', '')
          s = s.replace('    private EditBox guildWebsiteBox;\n', '')
          s = s.replace('        discordEndpointBox = null;\n', '')
          s = s.replace('        guildWebsiteBox = null;\n', '')
          s = s.replace('            discordEndpointBox = field(left, 300, boxWidth, config.discordReportEndpoint, "https://tastyfish.org/api/farming/discord-report");\n', '')
          s = re.sub(r'        if \(page == HUD\) \{.*?        \}\n        refreshSkysoft\(true\);', '        refreshSkysoft(true);', s, count=1, flags=re.S)
          s = s.replace('        g.text(font, "The optional relay secret stays in the local config.", rx, 300, 0xFFFFB85A, false);', '        g.text(font, "Reports are sent to the standalone farming server.", rx, 300, 0xFFFFB85A, false);')
          s = s.replace('        g.text(font, "Target a Discord channel or forum by ID",', '        g.text(font, "Discord report settings",')
          s = s.replace('        g.text(font, "SkySoft endpoint", left + 24, 104, MUTED, false);\n        g.text(font, config.endpoint, left + 24, 124, TEXT, false);', '        g.text(font, "Website", left + 24, 104, MUTED, false);\n        g.text(font, "https://tastyfish.org", left + 24, 124, TEXT, false);\n        g.text(font, "Farming server", left + 24, 145, MUTED, false);\n        g.text(font, "https://farming.tastyfish.org", left + 24, 165, TEXT, false);')
          s = s.replace('        g.text(font, "Guild HUD commands", left + 24, 285, MUTED, false);\n        g.text(font, "/tf guildhud  •  /tf stats  •  /tf discord", left + 24, 305, TEXT, false);', '        g.text(font, "Commands", left + 24, 285, MUTED, false);\n        g.text(font, "/tf stats  •  /tf discord", left + 24, 305, TEXT, false);')
          s = s.replace('        g.text(font, "Discord relay secret", left + 24, 345, MUTED, false);\n        g.text(font, config.discordReportSecret.isBlank() ? "Not configured" : "Configured", left + 24, 365,\n            config.discordReportSecret.isBlank() ? MUTED : GREEN, false);\n        g.text(font, "Edit it in config/tastyfish-mod.json; it is never sent to Discord.", left + 24, 400, MUTED, false);', '        g.text(font, "Guild HUD", left + 24, 345, MUTED, false);\n        g.text(font, "Move and resize it with /tf gui", left + 24, 365, TEXT, false);')
          s = s.replace('        if (discordEndpointBox != null) config.discordReportEndpoint = discordEndpointBox.getValue().trim();\n', '')
          s = s.replace('        if (guildWebsiteBox != null) config.guildLeaderboardWebsite = guildWebsiteBox.getValue().trim();\n', '')
          s = s.replace('            int boxWidth = Math.min(520, Math.max(260, contentWidth() - 80));\n            discordChannelBox = field(left, 150, boxWidth, config.discordChannelId, "Discord channel ID");\n            discordForumBox = field(left, 215, boxWidth, config.discordForumId, "Discord forum channel ID");', '            int boxWidth = 180;\n            discordChannelBox = field(left, 150, boxWidth, config.discordChannelId, "Discord channel ID");\n            discordForumBox = field(left, 215, boxWidth, config.discordForumId, "Discord forum channel ID");')
          marker = '        refreshSkysoft(false);\n        drawBackground(graphics);'
          replacement = '        refreshSkysoft(false);\n        resizeDiscordFields();\n        drawBackground(graphics);'
          s = s.replace(marker, replacement)
          insert = '''\n    private void resizeDiscordFields() {\n        if (page != DISCORD) return;\n        int collapsed = 180;\n        int expanded = Math.min(520, Math.max(260, contentWidth() - 80));\n        if (discordChannelBox != null) discordChannelBox.setWidth(discordChannelBox.isFocused() ? expanded : collapsed);\n        if (discordForumBox != null) discordForumBox.setWidth(discordForumBox.isFocused() ? expanded : collapsed);\n    }\n'''
          s = s.replace('    private void drawBackground(GuiGraphicsExtractor g) {', insert + '\n    private void drawBackground(GuiGraphicsExtractor g) {')
          p.write_text(s)
          PY

      - name: Validate and build
        run: |
          grep -R "guildhud" -n src/main/java || true
          grep -R "discordEndpointBox\|guildWebsiteBox" -n src/main/java || true
          gradle build --no-daemon

      - name: Commit fixes and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-gui-and-farming-discord.yml
          git add src/main/java .github/workflows/fix-gui-and-farming-discord.yml
          git commit -m "Fix GUI endpoint fields and guild HUD [auto-fix-gui]" || exit 0
          git push
