name: Fix 26.2 compile errors

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix 26.2 compile errors'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch 26.2 API changes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          mod = Path('src/main/java/com/epic60869/tastyfish/TastyFishMod.java')
          text = mod.read_text()
          text = text.replace('mc.player.displayClientMessage(net.minecraft.network.chat.Component.literal(', 'mc.showDebugChat(net.minecraft.network.chat.Component.literal(')
          text = text.replace('minecraft.player.displayClientMessage(net.minecraft.network.chat.Component.literal(', 'minecraft.showDebugChat(net.minecraft.network.chat.Component.literal(')
          mod.write_text(text)

          screen = Path('src/main/java/com/epic60869/tastyfish/TastyFishScreen.java')
          text = screen.read_text()
          text = text.replace('private static String coins(long value) { return number(value) + " coins"; }', 'private static String coins(double value) { return String.format(Locale.ROOT, "%,.0f coins", value); }')
          screen.write_text(text)
          PY

      - name: Verify changes
        run: |
          grep -n "showDebugChat" src/main/java/com/epic60869/tastyfish/TastyFishMod.java
          grep -n "private static String coins" src/main/java/com/epic60869/tastyfish/TastyFishScreen.java

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/epic60869/tastyfish/TastyFishMod.java src/main/java/com/epic60869/tastyfish/TastyFishScreen.java .github/workflows/fix-26.2-compile.yml
          git rm .github/workflows/fix-26.2-compile.yml
          git commit -m "Fix 26.2 compile errors"
          git push
